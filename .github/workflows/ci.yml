# Quire CI: extension checks and build, helper checks and release builds, and
# end-to-end tests of the unpacked extension talking to the real helper on
# Windows. Pushes to work branches build only the Windows helper; macOS and
# Linux are built only by a manual run with "all_os" (for releases). Main is
# not rebuilt after a merge, since its branch already passed.
# A push runs only the e2e specs the branch's changes can break (picked by
# apps/extension/e2e/scope.ts); a manual run always runs the whole suite.
# A stale pnpm-lock.yaml is regenerated here and shared as an artifact; the
# "lockfile" job stays red until that regenerated file is committed.
name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      all_os:
        description: Also build and test the helper for macOS and Linux
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      lockfile-changed: ${{ steps.deps.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-node@v7
        if: hashFiles('pnpm-lock.yaml') == ''
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        id: deps
        run: |
          if [ -f pnpm-lock.yaml ] && pnpm install --frozen-lockfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            pnpm install --no-frozen-lockfile
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error

  # Fails until regenerated lockfiles from the "lockfile" and "cargo-lockfile"
  # artifacts are committed, so main never depends on a lockfile that only existed inside CI.
  lockfile:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the committed pnpm-lock.yaml to be current
        if: needs.install.outputs.lockfile-changed == 'true'
        run: |
          echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml is out of date. Commit the lockfile artifact from this run."
          exit 1
      - name: Require the committed Cargo.lock to be current
        working-directory: helper
        run: |
          rustup toolchain install
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error file=helper/Cargo.lock::helper/Cargo.lock is out of date. Commit the cargo-lockfile artifact from this run."
            exit 1
          fi

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - uses: actions/upload-artifact@v7
        with:
          name: quire-extension
          path: apps/extension/dist
          if-no-files-found: error

  helper:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.all_os && '[{"os":"windows-latest","name":"windows","python":"python"},{"os":"macos-latest","name":"macos","python":"python3"},{"os":"ubuntu-latest","name":"linux","python":"python3"}]' || '[{"os":"windows-latest","name":"windows","python":"python"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: helper
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - name: Add Linux musl target
        if: matrix.name == 'linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add macOS targets
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper
      - name: Choose lockfile mode
        run: |
          if [ -f Cargo.lock ] && cargo metadata --locked --format-version 1 > /dev/null; then
            echo "CARGO_LOCK_FLAG=--locked" >> "$GITHUB_ENV"
          else
            cargo metadata --format-version 1 > /dev/null
            echo "CARGO_LOCK_FLAG=" >> "$GITHUB_ENV"
          fi
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets $CARGO_LOCK_FLAG -- -D warnings
      - name: Unit tests
        run: cargo test $CARGO_LOCK_FLAG
      - name: Release build (Windows)
        if: matrix.name == 'windows'
        run: |
          cargo build --release $CARGO_LOCK_FLAG
          mkdir -p out
          cp target/release/quire-helper.exe out/
      - name: Release build (Linux, static musl)
        if: matrix.name == 'linux'
        run: |
          cargo build --release --target x86_64-unknown-linux-musl $CARGO_LOCK_FLAG
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/quire-helper out/
      - name: Release build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --target aarch64-apple-darwin $CARGO_LOCK_FLAG
          cargo build --release --target x86_64-apple-darwin $CARGO_LOCK_FLAG
          mkdir -p out
          lipo -create -output out/quire-helper \
            target/aarch64-apple-darwin/release/quire-helper \
            target/x86_64-apple-darwin/release/quire-helper
          lipo -info out/quire-helper
      - name: Install smoke test
        run: ${{ matrix.python }} scripts/smoke.py "out/quire-helper${{ matrix.name == 'windows' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: quire-helper-${{ matrix.name }}
          path: helper/out
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'windows'
        with:
          name: cargo-lockfile
          path: helper/Cargo.lock
          if-no-files-found: error

  # Picks the e2e specs from the files the branch changed since it left main.
  e2e-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.pick.outputs.scope }}
      specs: ${{ steps.pick.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Pick the specs
        id: pick
        working-directory: apps/extension
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'scope=all\nspecs=\n' | tee -a "$GITHUB_OUTPUT"
          else
            node e2e/scope.ts origin/main | tee -a "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: [build, helper, e2e-scope]
    if: needs.e2e-scope.outputs.scope != 'none'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: quire-extension
          path: apps/extension/dist
      - uses: actions/download-artifact@v8
        with:
          name: quire-helper-windows
          path: helper-bin
      - name: Point the tests at the helper
        run: echo "QUIRE_HELPER_BINARY=$GITHUB_WORKSPACE/helper-bin/quire-helper.exe" >> "$GITHUB_ENV"
      # No --with-deps: on Windows it only adds Media Foundation (about three
      # minutes), which the Chromium the suite runs does not need.
      - run: pnpm --filter @quire/extension exec playwright install chromium
      - name: Run the picked specs
        env:
          SPECS: ${{ needs.e2e-scope.outputs.specs }}
        run: |
          set -f
          pnpm --filter @quire/extension e2e $SPECS
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          if-no-files-found: ignore
