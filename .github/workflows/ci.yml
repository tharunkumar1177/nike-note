# Quire CI: extension checks and build, helper checks and per-OS release builds,
# and end-to-end tests of the unpacked extension talking to the real helper.
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-node@v7
        if: hashFiles('pnpm-lock.yaml') == ''
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - uses: actions/upload-artifact@v7
        with:
          name: quire-extension
          path: apps/extension/dist
          if-no-files-found: error

  helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            python: python
          - os: macos-latest
            name: macos
            python: python3
          - os: ubuntu-latest
            name: linux
            python: python3
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: helper
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - name: Add Linux musl target
        if: matrix.name == 'linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add macOS targets
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper
      - name: Choose lockfile mode
        run: |
          if [ -f Cargo.lock ]; then
            echo "CARGO_LOCK_FLAG=--locked" >> "$GITHUB_ENV"
          else
            cargo generate-lockfile
            echo "CARGO_LOCK_FLAG=" >> "$GITHUB_ENV"
          fi
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets $CARGO_LOCK_FLAG -- -D warnings
      - name: Unit tests
        run: cargo test $CARGO_LOCK_FLAG
      - name: Release build (Windows)
        if: matrix.name == 'windows'
        run: |
          cargo build --release $CARGO_LOCK_FLAG
          mkdir -p out
          cp target/release/quire-helper.exe out/
      - name: Release build (Linux, static musl)
        if: matrix.name == 'linux'
        run: |
          cargo build --release --target x86_64-unknown-linux-musl $CARGO_LOCK_FLAG
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/quire-helper out/
      - name: Release build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --target aarch64-apple-darwin $CARGO_LOCK_FLAG
          cargo build --release --target x86_64-apple-darwin $CARGO_LOCK_FLAG
          mkdir -p out
          lipo -create -output out/quire-helper \
            target/aarch64-apple-darwin/release/quire-helper \
            target/x86_64-apple-darwin/release/quire-helper
          lipo -info out/quire-helper
      - name: Install smoke test
        run: ${{ matrix.python }} scripts/smoke.py "out/quire-helper${{ matrix.name == 'windows' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: quire-helper-${{ matrix.name }}
          path: helper/out
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'linux'
        with:
          name: cargo-lockfile
          path: helper/Cargo.lock
          if-no-files-found: error

  e2e:
    needs: [build, helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: quire-extension
          path: apps/extension/dist
      - uses: actions/download-artifact@v8
        with:
          name: quire-helper-linux
          path: helper-bin
      - name: Make the helper executable
        run: |
          chmod +x helper-bin/quire-helper
          echo "QUIRE_HELPER_BINARY=$GITHUB_WORKSPACE/helper-bin/quire-helper" >> "$GITHUB_ENV"
      - run: pnpm --filter @quire/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @quire/extension e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          if-no-files-found: ignore
