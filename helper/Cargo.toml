# Quire Helper: native messaging host and local notes-folder service for the Quire extension.
[package]
name = "quire-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Native messaging helper for the Quire browser extension"

[dependencies]
notify = "8"
serde_json = "1.0.154"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
